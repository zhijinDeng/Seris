      .box-neutral { fill: rgba(30,41,59,.55); stroke: #94a3b8; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.6; marker-end: url(#arrow); }
      .arrow-cyan { fill: none; stroke: #22d3ee; stroke-width: 1.8; marker-end: url(#arrow-cyan); }
      .arrow-green { fill: none; stroke: #34d399; stroke-width: 1.8; marker-end: url(#arrow-green); }
