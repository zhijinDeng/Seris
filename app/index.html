<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>赛力斯质量管控AI数字员工</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>赛力斯质量管控AI数字员工</h1>
      <p>Graph RAG × 知识图谱 × Autonomous Agent × 飞书协同</p>
    </div>
    <div class="status">试点演示</div>
  </header>
  <main class="layout">
    <section class="panel events">
      <h2>异常事件流</h2>
      <div id="events"></div>
    </section>
    <section class="panel reasoning">
      <h2>证据链与处置方案</h2>
      <div id="reasoning"></div>
    </section>
    <section class="panel board">
      <h2>飞书任务看板</h2>
      <div id="tasks"></div>
    </section>
    <section class="metrics">
      <article><strong>50%</strong><span>异常定位时间目标下降</span></article>
      <article><strong>100%</strong><span>关键工序追溯覆盖目标</span></article>
      <article><strong>20%</strong><span>重复质量问题目标下降</span></article>
      <article><strong>3</strong><span>首期试点场景</span></article>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
